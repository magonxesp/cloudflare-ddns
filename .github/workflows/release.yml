name: Build release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - CHANGELOG.md

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
            artifact: cloudflare-ddns-linux-amd64.deb
          - runner: ubuntu-24.04-arm
            architecture: arm64
            artifact: cloudflare-ddns-linux-arm64.deb

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build deb package
        run: |
          make deb
          cp target/release/bundle/cloudflare-ddns_*_${{ matrix.architecture }}.deb ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs:
      - build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: target
          merge-multiple: true

      - name: Tag version
        id: tag
        run: |
          VERSION="$(date +%Y-%m-%d.%H%M%S)"
          git tag "$VERSION"
          git push --tags
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.version }}
          artifacts: target/*

  docker:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: magonx/cloudflare-ddns:${{ needs.release.outputs.version }},magonx/cloudflare-ddns:latest
