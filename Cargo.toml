[package]
name = "cloudflare-ddns"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A small synchronous Cloudflare dynamic DNS client"
repository = "https://github.com/magonxesp/cloudflare-ddns"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
fern = "0.7"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
